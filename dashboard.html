<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA — Portfolio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#07111f;
  --bg2:#0a1626;
  --card:#0d1b2d;
  --card2:#101f33;
  --border:rgba(255,255,255,.08);
  --text:#f5f7fa;
  --muted:#8e9aaa;
  --gold:#d9a441;
  --gold2:#f0c866;
  --green:#31c48d;
  --red:#ef6b73;
  --shadow:0 18px 50px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at top right,rgba(217,164,65,.07),transparent 30%),
    linear-gradient(180deg,var(--bg),#050c16);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
select,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding-bottom:95px;
}

/* =========================
   LOADING
========================= */

.loading-screen{
  position:fixed;
  inset:0;
  background:#07111f;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loading-box{
  text-align:center;
}

.loading-logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:2px;
  color:#fff;
}

.loading-logo span{
  color:var(--gold);
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid rgba(217,164,65,.2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:20px auto 0;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================
   TOPBAR
========================= */

.topbar{
  height:68px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,17,31,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.topbar-inner{
  height:100%;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:21px;
  font-weight:850;
  letter-spacing:2px;
}

.logo span{
  color:var(--gold);
}

.profile-initial{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(145deg,#d9a441,#8f6820);
  color:#07111f;
  font-size:13px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   DRAWER
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:190;
  display:none;
}

.overlay.show{
  display:block;
}

.drawer{
  position:fixed;
  top:0;
  left:-310px;
  width:290px;
  max-width:86%;
  height:100vh;
  background:#091625;
  border-right:1px solid var(--border);
  z-index:200;
  transition:left .25s ease;
  padding:22px 15px;
}

.drawer.open{
  left:0;
}

.drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 7px 25px;
  border-bottom:1px solid var(--border);
}

.drawer-brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:2px;
}

.drawer-brand span{
  color:var(--gold);
}

.close-drawer{
  border:0;
  background:none;
  color:#fff;
  font-size:25px;
}

.drawer-nav{
  padding-top:18px;
}

.drawer-link{
  width:100%;
  border:0;
  background:transparent;
  color:#d7dce4;
  padding:14px 13px;
  display:flex;
  align-items:center;
  gap:13px;
  border-radius:11px;
  text-align:left;
  margin-bottom:4px;
}

.drawer-link:hover{
  background:rgba(217,164,65,.08);
  color:var(--gold2);
}

.drawer-icon{
  width:22px;
  text-align:center;
  color:var(--gold);
}

.logout{
  margin-top:15px;
  color:#ef8990;
}

/* =========================
   CONTENT
========================= */

.content{
  padding:25px 18px 0;
}

.greeting{
  margin-bottom:20px;
}

.greeting small{
  color:var(--muted);
  font-size:13px;
}

.greeting h1{
  margin-top:4px;
  font-size:24px;
  font-weight:750;
}

/* =========================
   PORTFOLIO
========================= */

.portfolio-card{

  border-radius:20px;
  padding:23px;
  box-shadow:var(--shadow);
}

.card-label{
  color:var(--muted);
  font-size:13px;
}

.portfolio-value{
  font-size:34px;
  font-weight:780;
  margin-top:7px;
  letter-spacing:-1px;
}

.portfolio-sub{
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
}

.status-row{
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--border);
  padding-top:15px;
}

.status-label{
  color:var(--muted);
  font-size:12px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:700;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:25px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
}

.section-title h2{
  font-size:16px;
  font-weight:700;
}

.section-title span{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   CRYPTO DROPDOWN
========================= */

.asset-picker{
  position:relative;
}

.asset-select{
  width:100%;
  min-height:70px;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--card);
  color:#fff;

  outline:none;
  font-size:14px;
}

.asset-select:focus{
  border-color:rgba(217,164,65,.5);
}

.asset-arrow{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);

  color:var(--gold);
}

.asset-preview{
  margin-top:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.asset-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.coin-logo{
  width:38px;
  height:38px;
  border-radius:50%;

  background:#fff;
  padding:2px;
}

.asset-name{
  font-weight:700;
  font-size:14px;
}

.asset-network{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.asset-balance{
  text-align:right;
}

.asset-balance strong{
  display:block;
  font-size:15px;
}

.asset-balance small{
  color:var(--muted);
  font-size:10px;
}

/* =========================
   COUNTDOWN
========================= */

.countdown-card{
  background:linear-gradient(145deg,#111f32,#0c1727);
  border:1px solid rgba(217,164,65,.18);
  border-radius:19px;
  padding:22px;
  text-align:center;
}

.countdown-icon{
  width:45px;
  height:45px;
  border-radius:50%;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(217,164,65,.1);
  color:var(--gold2);
  font-size:21px;
}

.countdown-title{
  font-size:14px;
  font-weight:700;
}

.countdown-state{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.timer{
  margin-top:16px;
  font-size:31px;
  letter-spacing:3px;
  font-weight:800;
  color:var(--gold2);
  font-variant-numeric:tabular-nums;
}

.timer-label{
  color:#697789;
  font-size:9px;
  letter-spacing:2px;
  margin-top:5px;
}

.countdown-hidden{
  display:none;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.quick-btn{
  min-height:90px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--card);
  color:#fff;
  padding:15px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.quick-btn:hover{
  border-color:rgba(217,164,65,.35);
}

.quick-icon{
  width:35px;
  height:35px;
  border-radius:10px;
  background:rgba(217,164,65,.1);
  color:var(--gold2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.quick-btn span:last-child{
  font-size:10px;
  color:#cbd1d9;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  height:70px;
  background:rgba(8,18,31,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  z-index:120;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.bottom-link{
  border:0;
  background:transparent;
  color:#7e8998;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:10px;
}

.bottom-link.active{
  color:var(--gold2);
}

.bottom-icon{
  font-size:20px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:87px;
  transform:translateX(-50%) translateY(15px);
  background:#142337;
  border:1px solid var(--border);
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:400px){
  .portfolio-value{
    font-size:29px;
  }

  .timer{
    font-size:27px;
  }
}
</style>
</head>

/* =========================================================

const SUPABASE_URL =

const SUPABASE_KEY =

const db = supabase.createClient(

/* =========================================================
   CRYPTO LOGOS
========================================================= */

const LOGO_BASE =
  "https://cdn.jsdelivr.net/gh/madenix/Crypto-logo-cdn@main/Logos/";

const logoFiles = {
  BTC:"BTC.svg",

};


/* =========================================================
   SUPPORTED ASSETS
========================================================= */

const assets = [
  ["BTC","Bitcoin"],
  ["ETH","Ethereum"],
  ["USDT","Tether"],
  ["USDC","USD Coin"],
  ["BNB","BNB"],
  ["SOL","Solana"],
  ["XRP","XRP"],
  ["TON","Toncoin"],
  ["DOGE","Dogecoin"],
  ["ADA","Cardano"],
  ["TRX","TRON"],
  ["LTC","Litecoin"],
  ["AVAX","Avalanche"],
  ["DOT","Polkadot"],
  ["LINK","Chainlink"],
  ["POL","Polygon"],
  ["SHIB","Shiba Inu"],
  ["BCH","Bitcoin Cash"],
  ["XLM","Stellar"],
  ["ATOM","Cosmos"],
  ["NEAR","NEAR Protocol"],
  ["APT","Aptos"],
  ["ARB","Arbitrum"],
  ["OP","Optimism"]
];


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let wallets = [];
let activeDeposits = [];
let countdownTarget = null;
let countdownInterval = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function go(page){
  window.location.href = page;
}

function formatNumber(value, max = 8){
  const n = Number(value || 0);

  return n.toLocaleString("en-US", {
    minimumFractionDigits:0,
    maximumFractionDigits:max
  });
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(message){
  const toast = $("toast");

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2500);
}

function initials(name){
  const value = String(name || "").trim();

  if(!value){
    return "N";
  }

  const parts = value.split(/\s+/);

  if(parts.length === 1){
    return parts[0].slice(0,2).toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();
}


/* =========================================================
   DRAWER
========================================================= */

function openDrawer(){
  $("drawer").classList.add("open");
  $("overlay").classList.add("show");
}

function closeDrawer(){
  $("drawer").classList.remove("open");
  $("overlay").classList.remove("show");
}

$("menuBtn").addEventListener("click",openDrawer);
$("closeDrawer").addEventListener("click",closeDrawer);
$("overlay").addEventListener("click",closeDrawer);


/* =========================================================
   LOAD ASSET DROPDOWN
========================================================= */

function buildAssetDropdown(){

  const select = $("assetSelect");

  select.innerHTML = "";

  assets.forEach(([symbol,name])=>{

    const option = document.createElement("option");

    option.value = symbol;
    option.textContent = `${symbol} — ${name}`;

    select.appendChild(option);

  });

  select.value = "USDT";

  select.addEventListener(
    "change",
    renderSelectedAsset
  );
}


/* =========================================================
   WALLET HELPERS
========================================================= */

function getWallet(symbol){

  return wallets.find(
    wallet =>
      String(wallet.asset).toUpperCase() ===
      String(symbol).toUpperCase()
  ) || null;

}


/* =========================================================
   RENDER SELECTED ASSET
========================================================= */

function renderSelectedAsset(){

  const symbol = $("assetSelect").value;

  const asset = assets.find(
    item => item[0] === symbol
  );

  const wallet = getWallet(symbol);

  if(!asset){
    return;
  }

  const name = asset[1];

  $("selectedAssetName").textContent = name;
  $("selectedAssetSymbol").textContent = symbol;
  $("selectedNetwork").textContent =
    wallet?.network ||
    "Wallet";

  $("selectedBalance").textContent =
    formatNumber(wallet?.available_balance || 0,8);

  const logo =
    LOGO_BASE +
    (logoFiles[symbol] || "");

  $("selectedLogo").src = logo;

  $("selectedLogo").onerror = function(){
    this.style.visibility = "hidden";
  };

  $("selectedLogo").style.visibility = "visible";
}


/* =========================================================
   PORTFOLIO
========================================================= */

function renderPortfolio(){

  /*
    We do not invent USD prices for BTC, ETH, etc.

    USDT is treated as USD-equivalent.
  */

  const usdt = getWallet("USDT");

  const available =
    Number(usdt?.available_balance || 0);

  const locked =
    Number(usdt?.locked_balance || 0);

  const total =
    available + locked;

  $("portfolioValue").textContent =
    "$" +
    total.toLocaleString("en-US",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  const { data, error } = await db
    .from("profiles")
    .select(`
      id,
      full_name,
      email,
      account_status
    `)
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error("Profile error:",error);
    return;
  }

  const name =
    data?.full_name ||
    currentUser.user_metadata?.full_name ||
    "Welcome";

  $("userName").textContent =
    name;

  $("profileInitial").textContent =
    initials(name);

  const status =
    String(data?.account_status || "PENDING")
      .toUpperCase();

  $("accountStatus").innerHTML = `
    <span class="status-dot"
      style="background:${
        status === "ACTIVE"
        ? "var(--green)"
        : status === "SUSPENDED"
        ? "var(--red)"
        : "var(--gold)"
      }">
    </span>
    <span>${escapeHtml(status)}</span>
  `;

}


/* =========================================================
   WALLETS
========================================================= */

async function loadWallets(){

  const { data, error } = await db
    .from("wallets")
    .select(`
      id,
      asset,
      available_balance,
      locked_balance,
      principal_balance,
      profit_balance
    `)
    .eq("user_id",currentUser.id);

  if(error){
    console.error("Wallet error:",error);
    showToast("Unable to load wallets");
    return;
  }

  wallets = data || [];

  renderPortfolio();
  renderSelectedAsset();

}


/* =========================================================
   ACTIVE CONFIRMED DEPOSITS
========================================================= */

async function loadActiveDeposits(){

  const { data, error } = await db
    .from("deposits")
    .select(`
      id,
      asset,
      network,
      earning_principal,
      earning_started_at,
      earning_ended_at,
      status
    `)
    .eq("user_id",currentUser.id)
    .eq("status","CONFIRMED")
    .gt("earning_principal",0)
    .not("earning_started_at","is",null)
    .is("earning_ended_at",null);

  if(error){
    console.error("Deposit countdown error:",error);

    activeDeposits = [];

    stopCountdown();

    $("countdownState").textContent =
      "Awaiting confirmed deposit";

    $("countdownAsset").textContent =
      "—";

    $("timerBox").classList.add(
      "countdown-hidden"
    );

    return;
  }

  activeDeposits = data || [];

  setupCountdown();

}


/* =========================================================
   NEXT 24-HOUR CALCULATION
========================================================= */

function getNextCalculationTime(
  startedAt,
  nowMs
){

  const start =
    new Date(startedAt).getTime();

  if(!Number.isFinite(start)){
    return null;
  }

  const cycle =
    24 * 60 * 60 * 1000;

  if(nowMs < start){
    return start;
  }

  const elapsed =
    nowMs - start;

  const cyclesCompleted =
    Math.floor(
      elapsed / cycle
    );

  return (
    start +
    (cyclesCompleted + 1) * cycle
  );

}


/* =========================================================
   COUNTDOWN SETUP
========================================================= */

function setupCountdown(){

  stopCountdown();

  if(!activeDeposits.length){

    $("countdownState").textContent =
      "Awaiting confirmed deposit";

    $("countdownAsset").textContent =
      "—";

    $("timerBox").classList.add(
      "countdown-hidden"
    );

    return;
  }

  const now = Date.now();

  const depositsWithTargets =
    activeDeposits
      .map(deposit => {

        const target =
          getNextCalculationTime(
            deposit.earning_started_at,
            now
          );

        return {
          ...deposit,
          target
        };

      })
      .filter(
        item =>
          Number.isFinite(item.target)
      );

  if(!depositsWithTargets.length){

    $("countdownState").textContent =
      "Awaiting confirmed deposit";

    $("timerBox").classList.add(
      "countdown-hidden"
    );

    return;
  }

  /*
    If there are multiple active deposits,
    show the nearest upcoming calculation.
  */

  depositsWithTargets.sort(
    (a,b) =>
      a.target - b.target
  );

  const next =
    depositsWithTargets[0];

  countdownTarget =
    next.target;

  $("countdownAsset").textContent =
    next.asset || "—";

  $("countdownState").textContent =
    "Active deposit confirmed";

  $("timerBox").classList.remove(
    "countdown-hidden"
  );

  updateCountdown();

  countdownInterval =
    setInterval(
      updateCountdown,
      1000
    );

}


/* =========================================================
   UPDATE COUNTDOWN
========================================================= */

function updateCountdown(){

  if(!countdownTarget){
    return;
  }

  const remaining =
    Math.max(
      0,
      countdownTarget - Date.now()
    );

  if(remaining <= 0){

    $("timer").textContent =
      "00:00:00";

    /*
      Refresh Supabase state shortly after
      reaching the target.
    */

    setTimeout(
      refreshDashboardData,
      1500
    );

    return;
  }

  const totalSeconds =
    Math.floor(
      remaining / 1000
    );

  const hours =
    Math.floor(
      totalSeconds / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  $("timer").textContent =
    String(hours).padStart(2,"0") +
    ":" +
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");

}


/* =========================================================
   STOP COUNTDOWN
========================================================= */

function stopCountdown(){

  if(countdownInterval){

    clearInterval(
      countdownInterval
    );

    countdownInterval = null;
  }

  countdownTarget = null;

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshDashboardData(){

  await Promise.all([
    loadProfile(),
    loadWallets(),
    loadActiveDeposits()
  ]);

}


/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

  const {
    data,
    error
  } = await db.auth.getSession();

  if(error){
    console.error(error);
  }

  currentUser =
    data?.session?.user || null;

  if(!currentUser){

    window.location.href =
      "signin.html";

    return false;
  }

  return true;

}


/* =========================================================
   LOGOUT
========================================================= */

$("logoutBtn").addEventListener(
  "click",
  async ()=>{

    await db.auth.signOut();

    window.location.href =
      "signin.html";

  }
);


/* =========================================================
   GREETING
========================================================= */

function setGreeting(){

  const hour =
    new Date().getHours();

  let text =
    "Welcome back";

  if(hour < 12){
    text = "Good morning";
  }
  else if(hour < 18){
    text = "Good afternoon";
  }
  else{
    text = "Good evening";
  }

  $("greetingText").textContent =
    text;

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState ===
      "visible"
    ){

      refreshDashboardData();

    }

  }
);


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  refreshDashboardData,
  30000
);


/* =========================================================
   INITIALIZE
========================================================= */

(async function init(){

  try{

    setGreeting();

    buildAssetDropdown();

    const authenticated =
      await checkAuth();

    if(!authenticated){
      return;
    }

    await refreshDashboardData();

  }
  catch(error){

    console.error(
      "Dashboard initialization error:",
      error
    );

    showToast(
      "Unable to load dashboard"
    );

  }
  finally{

    setTimeout(()=>{
      $("loadingScreen").style.display =
        "none";
    },250);

  }

})();
</script>
