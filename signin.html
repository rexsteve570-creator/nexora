<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In — NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo a{
    text-decoration:none;
    color:#d8b15a;
    font-size:27px;
    font-weight:800;
    letter-spacing:3px;
}

.card{
    background:#0d1b2c;
    border:1px solid rgba(216,177,90,.18);
    border-radius:18px;
    padding:27px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#93a1b5;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    color:#cbd5e1;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:49px;
    border-radius:10px;
    border:1px solid #26384e;
    background:#081522;
    color:#fff;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#d8b15a;
    box-shadow:0 0 0 3px rgba(216,177,90,.08);
}

input::placeholder{
    color:#637286;
}

.password-input{
    padding-right:70px;
}

.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#d8b15a;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.captcha-box{
    display:flex;
    gap:9px;
    align-items:center;
}

.captcha-code{
    flex:1;
    height:49px;
    border-radius:10px;
    background:#e7e9ed;
    color:#27303a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:800;
    letter-spacing:8px;
    user-select:none;
    text-decoration:line-through;
    transform:rotate(-1deg);
}

.refresh-btn{
    width:49px;
    height:49px;
    border-radius:10px;
    border:1px solid #26384e;
    background:#081522;
    color:#d8b15a;
    font-size:20px;
    cursor:pointer;
}

.forgot{
    display:flex;
    justify-content:flex-end;
    margin-top:-7px;
    margin-bottom:20px;
}

.forgot a{
    color:#d8b15a;
    font-size:12px;
    text-decoration:none;
}

button.submit{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#d8b15a;
    color:#08111d;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

button.submit:hover{
    filter:brightness(1.06);
}

button.submit:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px 13px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:rgba(220,38,38,.10);
    border:1px solid rgba(220,38,38,.30);
    color:#ff9b9b;
}

.message.success{
    display:block;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.30);
    color:#8be6aa;
}

.bottom{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#7f8da0;
}

.bottom a{
    color:#d8b15a;
    text-decoration:none;
    font-weight:700;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#78879a;
    font-size:12px;
    text-decoration:none;
}

.loading{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.spinner{
    width:15px;
    height:15px;
    border:2px solid rgba(8,17,29,.3);
    border-top-color:#08111d;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:380px){
    .card{
        padding:23px 17px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <a href="index.html">NEXORA</a>
    </div>

    <div class="card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to access your NEXORA account.
        </p>

        <div id="message" class="message"></div>

        <form id="signinForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="forgot">

                <a href="#" id="forgotPassword">
                    Forgot password?
                </a>

            </div>


            <div class="field">

                <label>
                    Security Check
                </label>

                <div class="captcha-box">

                    <div
                        id="captchaCode"
                        class="captcha-code"
                    ></div>

                    <button
                        type="button"
                        id="refreshCaptcha"
                        class="refresh-btn"
                        aria-label="Refresh CAPTCHA"
                    >
                        ↻
                    </button>

                </div>

                <input
                    type="text"
                    id="captchaInput"
                    placeholder="Enter the code above"
                    inputmode="numeric"
                    maxlength="3"
                    autocomplete="off"
                    style="margin-top:9px;"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit"
                id="submitBtn"
            >
                Sign In
            </button>

        </form>


        <div class="bottom">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>


        <div class="back">

            <a href="index.html">
                ← Back to NEXORA
            </a>

        </div>

    </div>

</div>


<script>

/* =========================================================
   NEXORA SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://rihvvwktvgytbqzazage.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_dT0xRQmaol55DD9yB7ta6Q_Rzrurfad";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                autoRefreshToken:true,
                persistSession:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById("signinForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const captchaInput =
    document.getElementById("captchaInput");

const captchaCode =
    document.getElementById("captchaCode");

const refreshCaptcha =
    document.getElementById("refreshCaptcha");

const submitBtn =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

    message.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });
}


function clearMessage(){

    message.className =
        "message";

    message.textContent =
        "";
}


/* =========================================================
   CAPTCHA
========================================================= */

let captchaValue = "";


function generateCaptcha(){

    captchaValue =
        Math.floor(
            100 +
            Math.random() * 900
        ).toString();

    captchaCode.textContent =
        captchaValue;

    captchaInput.value =
        "";
}


refreshCaptcha.addEventListener(
    "click",
    generateCaptcha
);

generateCaptcha();


/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

document
.getElementById("togglePassword")
.addEventListener("click",function(){

    if(passwordInput.type === "password"){

        passwordInput.type =
            "text";

        this.textContent =
            "Hide";

    }else{

        passwordInput.type =
            "password";

        this.textContent =
            "Show";
    }

});


/* =========================================================
   SIGN IN
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;

        const captchaEntered =
            captchaInput.value.trim();


        /* -----------------------------
           VALIDATION
        ----------------------------- */

        if(!email){

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            return;
        }


        if(captchaEntered !== captchaValue){

            showMessage(
                "Incorrect security code. Please try again.",
                "error"
            );

            generateCaptcha();

            return;
        }


        /* -----------------------------
           LOADING
        ----------------------------- */

        submitBtn.disabled =
            true;

        submitBtn.innerHTML =
            '<span class="loading">' +
            '<span class="spinner"></span>' +
            'Signing In...' +
            '</span>';


        try{

            /* -----------------------------
               SUPABASE LOGIN
            ----------------------------- */

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({
                    email:email,
                    password:password
                });


            if(error){

                console.error(
                    "Supabase sign-in error:",
                    error
                );

                throw error;
            }


            if(!data || !data.session){

                throw new Error(
                    "No active session was returned."
                );

            }


            /* -----------------------------
               SUCCESS
            ----------------------------- */

            showMessage(
                "Login successful. Opening your dashboard...",
                "success"
            );


            /*
             * Small delay so the user can
             * see the success message.
             */

            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },900);


        }catch(error){

            console.error(
                "Login error:",
                error
            );


            let errorMessage =
                "Unable to sign in. Please check your details and try again.";


            if(error && error.message){

                const msg =
                    error.message.toLowerCase();


                if(
                    msg.includes("invalid api key")
                ){

                    errorMessage =
                        "Supabase API authentication failed. Please verify the NEXORA project configuration.";

                }

                else if(
                    msg.includes("email not confirmed")
                ){

                    errorMessage =
                        "Please confirm your email address before signing in.";

                }

                else if(
                    msg.includes("invalid login credentials")
                ){

                    errorMessage =
                        "Incorrect email or password.";

                }

                else{

                    errorMessage =
                        error.message;

                }

            }


            showMessage(
                errorMessage,
                "error"
            );


            generateCaptcha();

        }finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Sign In";

        }

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

document
.getElementById("forgotPassword")
.addEventListener("click",function(event){

    event.preventDefault();


    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    if(!email){

        showMessage(
            "Enter your email address first, then tap Forgot password again.",
            "error"
        );

        emailInput.focus();

        return;
    }


    showMessage(
        "Password recovery will be connected next. Your login system is already connected to Supabase.",
        "success"
    );

});

</script>

</body>
</html>
