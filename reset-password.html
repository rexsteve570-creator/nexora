<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password — AITIVEST</title>
<meta name="theme-color" content="#07111f">
<meta name="description" content="Securely reset your AITIVEST account password."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo a{
    color:#d8b15a;
    text-decoration:none;
    font-size:27px;
    font-weight:800;
    letter-spacing:3px;
}

.card{
    background:#0d1b2c;
    border:1px solid rgba(216,177,90,.18);
    border-radius:18px;
    padding:27px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#93a1b5;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    color:#cbd5e1;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:49px;
    border-radius:10px;
    border:1px solid #26384e;
    background:#081522;
    color:#fff;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#d8b15a;
    box-shadow:0 0 0 3px rgba(216,177,90,.08);
}

input::placeholder{
    color:#637286;
}

.password-input{
    padding-right:70px;
}

.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#d8b15a;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

button.submit{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#d8b15a;
    color:#08111d;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

button.submit:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px 13px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:rgba(220,38,38,.10);
    border:1px solid rgba(220,38,38,.30);
    color:#ff9b9b;
}

.message.success{
    display:block;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.30);
    color:#8be6aa;
}

.bottom{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#7f8da0;
}

.bottom a{
    color:#d8b15a;
    text-decoration:none;
    font-weight:700;
}

.bottom a:hover,
.logo a:hover{
    color:#f0cf7a;
}

@media(max-width:360px){
    .card{
        padding:23px 17px;
    }

    h1{
        font-size:22px;
    }
}
</style></head><body><div class="container"><div class="logo">
    <a href="index.html" aria-label="AITIVEST home">AITIVEST</a>
</div>

<div class="card">

    <h1>Create New Password</h1>

    <p class="subtitle">
        Enter a new password for your AITIVEST account.
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="resetForm">

        <div class="field">
            <label for="password">New Password</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Enter new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    id="togglePassword"
                    aria-label="Show new password"
                >Show</button>
            </div>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm New Password</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="confirmPassword"
                    class="password-input"
                    placeholder="Confirm new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    id="toggleConfirm"
                    aria-label="Show password confirmation"
                >Show</button>
            </div>
        </div>

        <button
            type="submit"
            class="submit"
            id="submitBtn"
        >Update Password</button>

    </form>

    <div class="bottom">
        Remember your password?
        <a href="signin.html">Sign In</a>
    </div>

</div>

</div><script>
/* =========================================================
   AITIVEST SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://rihvvwktvgytbqzazage.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_dT0xRQmaol55DD9yB7ta6Q_Rzrurfad";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth:{
            autoRefreshToken:true,
            persistSession:true,
            detectSessionInUrl:true
        }
    }
);

/* =========================================================
   ELEMENTS
========================================================= */

const form = document.getElementById("resetForm");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

/* =========================================================
   MESSAGE DISPLAY
========================================================= */

function showMessage(text,type){
    message.className = "message " + type;
    message.textContent = text;
}

/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

function setupPasswordToggle(buttonId,input){
    const button = document.getElementById(buttonId);

    button.addEventListener("click",function(){
        const showing = input.type === "password";

        input.type = showing ? "text" : "password";
        this.textContent = showing ? "Hide" : "Show";

        this.setAttribute(
            "aria-label",
            showing ? "Hide password" : "Show password"
        );
    });
}

setupPasswordToggle("togglePassword",passwordInput);
setupPasswordToggle("toggleConfirm",confirmPasswordInput);

/* =========================================================
   PASSWORD RECOVERY SESSION
========================================================= */

let recoveryReady = false;

supabaseClient.auth.onAuthStateChange(function(event,session){
    if(event === "PASSWORD_RECOVERY" && session){
        recoveryReady = true;
    }
});

(async function checkRecoverySession(){
    try{
        const {data,error} = await supabaseClient.auth.getSession();

        if(error){
            throw error;
        }

        if(data && data.session){
            recoveryReady = true;
        }
    }catch(error){
        console.error("Recovery session check failed:",error);
    }
})();

/* =========================================================
   UPDATE PASSWORD
========================================================= */

form.addEventListener("submit",async function(event){
    event.preventDefault();

    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if(password.length < 8){
        showMessage(
            "Your new password must contain at least 8 characters.",
            "error"
        );
        return;
    }

    if(password !== confirmPassword){
        showMessage(
            "The passwords do not match.",
            "error"
        );
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating Password...";

    try{
        const {data:sessionData,error:sessionError} =
            await supabaseClient.auth.getSession();

        if(sessionError){
            throw sessionError;
        }

        if(!sessionData.session){
            showMessage(
                "Your password reset session is missing or has expired. Please request a new password reset link.",
                "error"
            );

            submitBtn.disabled = false;
            submitBtn.textContent = "Update Password";
            return;
        }

        const {error} = await supabaseClient.auth.updateUser({
            password:password
        });

        if(error){
            throw error;
        }

        showMessage(
            "Your AITIVEST password has been changed successfully. Redirecting you to Sign In...",
            "success"
        );

        await supabaseClient.auth.signOut();

        setTimeout(function(){
            window.location.href = "signin.html";
        },1800);

    }catch(error){
        console.error("AITIVEST password update error:",error);

        showMessage(
            error.message ||
            "Unable to update your password. Please request a new reset link.",
            "error"
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
    }
});
</script></body>
</html>
