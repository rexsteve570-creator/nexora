<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account — NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo a{
    text-decoration:none;
    color:#d8b15a;
    font-size:27px;
    font-weight:800;
    letter-spacing:3px;
}

.card{
    background:#0d1b2c;
    border:1px solid rgba(216,177,90,.18);
    border-radius:18px;
    padding:26px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#93a1b5;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:13px;
    color:#cbd5e1;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:48px;
    border-radius:10px;
    border:1px solid #26384e;
    background:#081522;
    color:#fff;
    padding:0 14px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#d8b15a;
    box-shadow:0 0 0 3px rgba(216,177,90,.08);
}

input::placeholder{
    color:#637286;
}

.password-input{
    padding-right:70px;
}

.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#d8b15a;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.strength{
    height:4px;
    width:100%;
    background:#172536;
    border-radius:10px;
    margin-top:7px;
    overflow:hidden;
}

.strength-bar{
    height:100%;
    width:0%;
    transition:.25s;
}

.strength-text{
    font-size:11px;
    color:#77869a;
    margin-top:5px;
}

.captcha-box{
    display:flex;
    gap:9px;
    align-items:center;
}

.captcha-code{
    flex:1;
    height:48px;
    border-radius:10px;
    background:#e7e9ed;
    color:#27303a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:800;
    letter-spacing:8px;
    user-select:none;
    text-decoration:line-through;
    transform:rotate(-1deg);
}

.refresh-btn{
    width:48px;
    height:48px;
    border-radius:10px;
    border:1px solid #26384e;
    background:#081522;
    color:#d8b15a;
    font-size:20px;
    cursor:pointer;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin:4px 0 18px;
}

.terms input{
    width:17px;
    height:17px;
    margin-top:2px;
    accent-color:#d8b15a;
}

.terms label{
    margin:0;
    font-size:12px;
    line-height:1.5;
    color:#8998aa;
}

.terms a{
    color:#d8b15a;
    text-decoration:none;
}

button.submit{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#d8b15a;
    color:#08111d;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

button.submit:hover{
    filter:brightness(1.06);
}

button.submit:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:12px 13px;
    border-radius:9px;
    margin-bottom:16px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:rgba(220,38,38,.10);
    border:1px solid rgba(220,38,38,.30);
    color:#ff9b9b;
}

.message.success{
    display:block;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.30);
    color:#8be6aa;
}

.bottom{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#7f8da0;
}

.bottom a{
    color:#d8b15a;
    text-decoration:none;
    font-weight:700;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#78879a;
    font-size:12px;
    text-decoration:none;
}

.loading{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.spinner{
    width:15px;
    height:15px;
    border:2px solid rgba(8,17,29,.3);
    border-top-color:#08111d;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:380px){
    .card{
        padding:23px 17px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <a href="index.html">NEXORA</a>
    </div>

    <div class="card">

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Create your NEXORA account to access your digital asset dashboard.
        </p>

        <div id="message" class="message"></div>

        <form id="signupForm">

            <div class="field">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>

                <div class="strength">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>

                <div id="strengthText" class="strength-text">
                    Use at least 8 characters.
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>

                <div class="input-wrap">
                    <input
                        type="password"
                        id="confirmPassword"
                        class="password-input"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="toggleConfirm"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="field">

                <label>Security Check</label>

                <div class="captcha-box">

                    <div
                        id="captchaCode"
                        class="captcha-code"
                    ></div>

                    <button
                        type="button"
                        id="refreshCaptcha"
                        class="refresh-btn"
                        aria-label="Refresh CAPTCHA"
                    >
                        ↻
                    </button>

                </div>

                <input
                    type="text"
                    id="captchaInput"
                    placeholder="Enter the code above"
                    inputmode="numeric"
                    maxlength="3"
                    autocomplete="off"
                    style="margin-top:9px;"
                    required
                >

            </div>

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the
                    <a href="index.html#terms">
                        Terms
                    </a>,
                    <a href="index.html#privacy">
                        Privacy Policy
                    </a>
                    and
                    <a href="index.html#risk">
                        Risk Disclosure
                    </a>.
                </label>

            </div>

            <button
                type="submit"
                class="submit"
                id="submitBtn"
            >
                Create Account
            </button>

        </form>

        <div class="bottom">
            Already have an account?
            <a href="signin.html">Sign In</a>
        </div>

        <div class="back">
            <a href="index.html">← Back to NEXORA</a>
        </div>

    </div>

</div>


<script>

/* =========================================================
   NEXORA SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://rihvvwktvgytbqzazage.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_dT0xRQmaol55DD9yB7ta6Q_Rzrurfad";


/* =========================================================
   CREATE SUPABASE CLIENT
========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                autoRefreshToken:true,
                persistSession:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById("signupForm");

const fullNameInput =
    document.getElementById("fullName");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const captchaInput =
    document.getElementById("captchaInput");

const captchaCode =
    document.getElementById("captchaCode");

const refreshCaptcha =
    document.getElementById("refreshCaptcha");

const terms =
    document.getElementById("terms");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");

const strengthBar =
    document.getElementById("strengthBar");

const strengthText =
    document.getElementById("strengthText");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

    message.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });
}


function clearMessage(){

    message.className =
        "message";

    message.textContent =
        "";
}


/* =========================================================
   CAPTCHA
========================================================= */

let captchaValue = "";


function generateCaptcha(){

    captchaValue =
        Math.floor(
            100 +
            Math.random() * 900
        ).toString();

    captchaCode.textContent =
        captchaValue;

    captchaInput.value = "";
}


refreshCaptcha.addEventListener(
    "click",
    generateCaptcha
);

generateCaptcha();


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

document
.getElementById("togglePassword")
.addEventListener("click",function(){

    if(passwordInput.type === "password"){

        passwordInput.type =
            "text";

        this.textContent =
            "Hide";

    }else{

        passwordInput.type =
            "password";

        this.textContent =
            "Show";
    }

});


document
.getElementById("toggleConfirm")
.addEventListener("click",function(){

    if(confirmPasswordInput.type === "password"){

        confirmPasswordInput.type =
            "text";

        this.textContent =
            "Hide";

    }else{

        confirmPasswordInput.type =
            "password";

        this.textContent =
            "Show";
    }

});


/* =========================================================
   PASSWORD STRENGTH
========================================================= */

passwordInput.addEventListener(
    "input",
    function(){

        const password =
            this.value;

        let score = 0;

        if(password.length >= 8)
            score++;

        if(/[A-Z]/.test(password))
            score++;

        if(/[a-z]/.test(password))
            score++;

        if(/[0-9]/.test(password))
            score++;

        if(/[^A-Za-z0-9]/.test(password))
            score++;


        if(password.length === 0){

            strengthBar.style.width =
                "0%";

            strengthText.textContent =
                "Use at least 8 characters.";

        }

        else if(score <= 2){

            strengthBar.style.width =
                "35%";

            strengthText.textContent =
                "Weak password.";

        }

        else if(score === 3){

            strengthBar.style.width =
                "60%";

            strengthText.textContent =
                "Moderate password.";

        }

        else if(score === 4){

            strengthBar.style.width =
                "80%";

            strengthText.textContent =
                "Strong password.";

        }

        else{

            strengthBar.style.width =
                "100%";

            strengthText.textContent =
                "Very strong password.";

        }

    }
);


/* =========================================================
   SIGN UP
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();


        const fullName =
            fullNameInput.value.trim();

        const email =
            emailInput.value.trim()
                .toLowerCase();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;

        const captchaEntered =
            captchaInput.value.trim();


        /* -----------------------------
           BASIC VALIDATION
        ----------------------------- */

        if(fullName.length < 2){

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if(!email){

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }


        if(password.length < 8){

            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        if(password !== confirmPassword){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        if(captchaEntered !== captchaValue){

            showMessage(
                "Incorrect security code. Please try again.",
                "error"
            );

            generateCaptcha();

            return;
        }


        if(!terms.checked){

            showMessage(
                "Please accept the terms before creating your account.",
                "error"
            );

            return;
        }


        /* -----------------------------
           LOADING
        ----------------------------- */

        submitBtn.disabled =
            true;

        submitBtn.innerHTML =
            '<span class="loading">' +
            '<span class="spinner"></span>' +
            'Creating Account...' +
            '</span>';


        try{

            /* -----------------------------
               SUPABASE AUTH SIGNUP
            ----------------------------- */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email:email,

                password:password,

                options:{
                    data:{
                        full_name:fullName
                    }
                }

            });


            if(error){

                console.error(
                    "Supabase signup error:",
                    error
                );

                throw error;
            }


            /* -----------------------------
               SUCCESS
            ----------------------------- */

            console.log(
                "Supabase signup response:",
                data
            );


            if(
                data.user &&
                !data.session
            ){

                showMessage(
                    "Account created successfully. Please check your email and confirm your email address before signing in.",
                    "success"
                );

            }else{

                showMessage(
                    "Your NEXORA account has been created successfully.",
                    "success"
                );

            }


            form.reset();

            strengthBar.style.width =
                "0%";

            strengthText.textContent =
                "Use at least 8 characters.";

            generateCaptcha();


            /* -----------------------------
               OPTIONAL REDIRECT
            ----------------------------- */

            setTimeout(function(){

                window.location.href =
                    "signin.html";

            },3500);


        }catch(error){

            console.error(
                "Registration error:",
                error
            );


            let errorMessage =
                "Unable to create your account. Please try again.";


            if(error){

                if(
                    error.message &&
                    error.message.toLowerCase()
                    .includes("user already registered")
                ){

                    errorMessage =
                        "An account with this email already exists. Please sign in instead.";

                }

                else if(
                    error.message &&
                    error.message.toLowerCase()
                    .includes("invalid api key")
                ){

                    errorMessage =
                        "Supabase API authentication failed. Please verify that this page is using the correct NEXORA project URL and publishable key.";

                }

                else if(
                    error.message &&
                    error.message.toLowerCase()
                    .includes("password")
                ){

                    errorMessage =
                        error.message;

                }

                else if(error.message){

                    errorMessage =
                        error.message;
                }

            }


            showMessage(
                errorMessage,
                "error"
            );


            generateCaptcha();


        }finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Create Account";

        }

    }
);

</script>

</body>
</html>
