<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — NEXORA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --navy: #071426;
    --navy-2: #0b1d33;
    --gold: #d7ad52;
    --gold-light: #f0d58a;
    --white: #ffffff;
    --muted: #94a3b8;
    --border: rgba(255,255,255,0.10);
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top right, rgba(215,173,82,0.10), transparent 32%),
        linear-gradient(145deg, var(--navy), #040b15);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
}

.topbar {
    width: 100%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(5,15,28,0.82);
    backdrop-filter: blur(12px);
}

.logo {
    text-decoration: none;
    color: var(--white);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    color: var(--gold);
}

.back-home {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
}

.back-home:hover {
    color: var(--gold-light);
}

.page {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 38px 20px 50px;
}

.auth-card {
    background: rgba(11,29,51,0.88);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 22px 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.30);
}

.heading {
    text-align: center;
    margin-bottom: 27px;
}

.heading h1 {
    font-size: 27px;
    font-weight: 700;
    margin-bottom: 8px;
}

.heading p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 13px;
    color: #dce3eb;
    margin-bottom: 8px;
    font-weight: 600;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    height: 50px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(3,12,23,0.72);
    color: var(--white);
    padding: 0 14px;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

input::placeholder {
    color: #64748b;
}

input:focus {
    border-color: rgba(215,173,82,0.75);
    box-shadow: 0 0 0 3px rgba(215,173,82,0.08);
}

.password-input {
    padding-right: 55px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #8391a4;
    cursor: pointer;
    font-size: 12px;
    padding: 6px;
}

.toggle-password:hover {
    color: var(--gold-light);
}

.password-strength {
    height: 3px;
    width: 100%;
    margin-top: 7px;
    background: rgba(255,255,255,0.07);
    border-radius: 10px;
    overflow: hidden;
}

.password-strength-bar {
    height: 100%;
    width: 0;
    transition: 0.25s;
    background: var(--gold);
}

.password-help {
    color: #718096;
    font-size: 11px;
    margin-top: 6px;
    line-height: 1.45;
}

.captcha-area {
    margin-top: 3px;
    margin-bottom: 20px;
}

.captcha-row {
    display: flex;
    align-items: center;
    gap: 9px;
}

.captcha-box {
    height: 50px;
    min-width: 130px;
    flex: 1;
    background: #e7e9ec;
    border: 1px solid #d2d5da;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    user-select: none;
}

.captcha-box::before,
.captcha-box::after {
    content: "";
    position: absolute;
    width: 120%;
    height: 1px;
    background: rgba(70,75,85,0.25);
}

.captcha-box::before {
    top: 16px;
    transform: rotate(-8deg);
}

.captcha-box::after {
    top: 32px;
    transform: rotate(7deg);
}

.captcha-code {
    position: relative;
    z-index: 2;
    color: #4d535c;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 5px;
    transform: rotate(-2deg) skewX(-5deg);
}

.captcha-refresh {
    width: 45px;
    height: 50px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: rgba(3,12,23,0.72);
    color: var(--gold);
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.captcha-refresh:hover {
    border-color: var(--gold);
}

.captcha-input {
    width: 100px;
    flex: 0 0 100px;
    text-align: center;
    padding: 0 10px;
}

.captcha-hint {
    color: #718096;
    font-size: 11px;
    margin-top: 7px;
}

.error-message {
    display: none;
    margin-top: 9px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(239,107,115,0.08);
    border: 1px solid rgba(239,107,115,0.22);
    color: #ff9aa0;
    font-size: 12px;
    line-height: 1.45;
}

.error-message.show {
    display: block;
}

.terms {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 4px 0 20px;
}

.terms input {
    width: 17px;
    height: 17px;
    flex: 0 0 17px;
    margin-top: 1px;
    accent-color: var(--gold);
    cursor: pointer;
}

.terms label {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.55;
    cursor: pointer;
}

.terms a {
    color: var(--gold-light);
    text-decoration: none;
}

.signup-btn {
    width: 100%;
    height: 51px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #d7ad52, #b88932);
    color: #071426;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
}

.signup-btn:hover {
    transform: translateY(-1px);
}

.signup-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

.status-message {
    display: none;
    margin-top: 14px;
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    line-height: 1.5;
}

.status-message.show {
    display: block;
}

.status-message.error {
    color: #ff9aa0;
    background: rgba(239,107,115,0.08);
    border: 1px solid rgba(239,107,115,0.18);
}

.status-message.success {
    color: #72e0ae;
    background: rgba(85,201,149,0.08);
    border: 1px solid rgba(85,201,149,0.18);
}

.signin-text {
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    font-size: 13px;
}

.signin-text a {
    color: var(--gold-light);
    text-decoration: none;
    font-weight: 700;
}

.security-note {
    text-align: center;
    color: #66758a;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 20px;
}

.footer {
    text-align: center;
    color: #536174;
    font-size: 11px;
    padding: 0 20px 20px;
}

@media (max-width:430px) {
    .page {
        padding: 28px 14px 40px;
    }

    .auth-card {
        padding: 27px 18px 23px;
    }

    .captcha-row {
        gap: 7px;
    }

    .captcha-box {
        min-width: 105px;
    }

    .captcha-input {
        width: 82px;
        flex-basis: 82px;
    }

    .captcha-refresh {
        width: 43px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <a href="index.html" class="logo">
        NEX<span>ORA</span>
    </a>

    <a href="index.html" class="back-home">
        Back to home
    </a>

</header>


<main class="page">

<section class="auth-card">

    <div class="heading">
        <h1>Create Account</h1>
        <p>Open your NEXORA account to get started.</p>
    </div>


    <form id="signupForm" novalidate>

        <div class="field">
            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >
        </div>


        <div class="field">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>


        <div class="field">

            <label for="password">Password</label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                >
                    Show
                </button>

            </div>

            <div class="password-strength">
                <div
                    id="passwordStrengthBar"
                    class="password-strength-bar"
                ></div>
            </div>

            <div class="password-help">
                Use at least 8 characters.
            </div>

        </div>


        <div class="field">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="confirmPassword"
                    class="password-input"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="toggleConfirmPassword"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="captcha-area">

            <label for="captchaInput">
                Security Code
            </label>

            <div class="captcha-row">

                <div class="captcha-box">
                    <span
                        id="captchaCode"
                        class="captcha-code"
                    ></span>
                </div>

                <button
                    type="button"
                    class="captcha-refresh"
                    id="refreshCaptcha"
                    aria-label="Generate new CAPTCHA"
                >
                    ↻
                </button>

                <input
                    type="text"
                    id="captchaInput"
                    class="captcha-input"
                    placeholder="code"
                    inputmode="numeric"
                    autocomplete="off"
                    maxlength="3"
                    required
                >

            </div>

            <div class="captcha-hint">
                Enter the 3-digit code shown above.
            </div>

            <div
                id="captchaError"
                class="error-message"
            ></div>

        </div>


        <div class="terms">

            <input
                type="checkbox"
                id="terms"
                required
            >

            <label for="terms">
                I agree to the
                <a href="index.html#terms">Terms & Conditions</a>,
                <a href="index.html#privacy">Privacy Policy</a>
                and acknowledge the
                <a href="index.html#risk">Risk Disclosure</a>.
            </label>

        </div>


        <button
            type="submit"
            class="signup-btn"
            id="signupButton"
        >
            Create Account
        </button>


        <div
            id="statusMessage"
            class="status-message"
        ></div>

    </form>


    <div class="signin-text">
        Already have an account?
        <a href="signin.html">Sign In</a>
    </div>


    <div class="security-note">
        Your account information is securely handled
        through NEXORA authentication.
    </div>

</section>

</main>


<div class="footer">
    © 2026 NEXORA. All rights reserved.
</div>


<!-- Supabase browser library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://cetsxdkoauucxwsbdktl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_b3FIKdfP_UKP0Ii8ZbMREw_CVqOQv9g";

const { createClient } =
    supabase;

const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   CAPTCHA
========================================================= */

let captchaAnswer = "";


function generateCaptcha() {

    captchaAnswer =
        Math.floor(
            100 + Math.random() * 900
        ).toString();

    document.getElementById(
        "captchaCode"
    ).textContent =
        captchaAnswer
            .split("")
            .join(" ");
}


function refreshCaptcha() {

    generateCaptcha();

    document.getElementById(
        "captchaInput"
    ).value = "";

    hideCaptchaError();

    document.getElementById(
        "captchaInput"
    ).focus();
}


function showCaptchaError(message) {

    const error =
        document.getElementById(
            "captchaError"
        );

    error.textContent = message;
    error.classList.add("show");
}


function hideCaptchaError() {

    const error =
        document.getElementById(
            "captchaError"
        );

    error.textContent = "";
    error.classList.remove("show");
}


document
    .getElementById("refreshCaptcha")
    .addEventListener(
        "click",
        refreshCaptcha
    );


document
    .getElementById("captchaInput")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 3);

            hideCaptchaError();
        }
    );


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

function setupPasswordToggle(
    buttonId,
    inputId
) {

    const button =
        document.getElementById(buttonId);

    const input =
        document.getElementById(inputId);

    button.addEventListener(
        "click",
        function () {

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "Hide";

            } else {

                input.type = "password";
                button.textContent = "Show";

            }

        }
    );
}


setupPasswordToggle(
    "togglePassword",
    "password"
);

setupPasswordToggle(
    "toggleConfirmPassword",
    "confirmPassword"
);


/* =========================================================
   PASSWORD STRENGTH
========================================================= */

const passwordInput =
    document.getElementById("password");

const strengthBar =
    document.getElementById(
        "passwordStrengthBar"
    );


passwordInput.addEventListener(
    "input",
    function () {

        const value = this.value;

        let strength = 0;

        if (value.length >= 8) {
            strength++;
        }

        if (/[A-Z]/.test(value)) {
            strength++;
        }

        if (/[0-9]/.test(value)) {
            strength++;
        }

        if (/[^A-Za-z0-9]/.test(value)) {
            strength++;
        }

        strengthBar.style.width =
            (strength * 25) + "%";

    }
);


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type) {

    const status =
        document.getElementById(
            "statusMessage"
        );

    status.className =
        "status-message show " + type;

    status.textContent = message;
}


function clearStatus() {

    const status =
        document.getElementById(
            "statusMessage"
        );

    status.className =
        "status-message";

    status.textContent = "";
}


/* =========================================================
   SIGN UP
========================================================= */

const signupForm =
    document.getElementById(
        "signupForm"
    );

const signupButton =
    document.getElementById(
        "signupButton"
    );


signupForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        clearStatus();
        hideCaptchaError();


        const fullName =
            document.getElementById(
                "fullName"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const captchaInput =
            document.getElementById(
                "captchaInput"
            ).value.trim();


        const terms =
            document.getElementById(
                "terms"
            ).checked;


        /* VALIDATION */

        if (!fullName) {

            showStatus(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if (!email) {

            showStatus(
                "Please enter your email address.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showStatus(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showStatus(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        if (!captchaInput) {

            showCaptchaError(
                "Please enter the security code."
            );

            return;
        }


        if (captchaInput !== captchaAnswer) {

            showCaptchaError(
                "Incorrect security code. A new code has been generated."
            );

            generateCaptcha();

            document.getElementById(
                "captchaInput"
            ).value = "";

            document.getElementById(
                "captchaInput"
            ).focus();

            return;
        }


        if (!terms) {

            showStatus(
                "Please accept the Terms & Conditions.",
                "error"
            );

            return;
        }


        /* BUTTON */

        signupButton.disabled = true;
        signupButton.textContent =
            "Creating Account...";


        try {

            /*
             * Create the Supabase Auth user.
             *
             * The full name is stored in user_metadata
             * for now. We will connect the profiles
             * table after confirming the current schema.
             */

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: fullName
                        }

                    }

                });


            if (error) {
                throw error;
            }


            /*
             * If email confirmation is enabled,
             * Supabase will require the user to
             * confirm their email.
             */

            if (
                data.user &&
                data.user.identities &&
                data.user.identities.length === 0
            ) {

                throw new Error(
                    "An account with this email may already exist."
                );
            }


            showStatus(
                "Account created successfully. Please check your email if confirmation is required, then sign in.",
                "success"
            );


            signupForm.reset();

            generateCaptcha();

            strengthBar.style.width = "0%";


            setTimeout(
                function () {

                    window.location.href =
                        "signin.html";

                },
                2500
            );


        } catch (error) {

            console.error(
                "Supabase signup error:",
                error
            );


            let message =
                error.message ||
                "Unable to create your account.";


            if (
                message.toLowerCase()
                    .includes("already registered")
            ) {

                message =
                    "An account with this email already exists. Please sign in instead.";

            }


            showStatus(
                message,
                "error"
            );


            generateCaptcha();

            document.getElementById(
                "captchaInput"
            ).value = "";


        } finally {

            signupButton.disabled = false;

            signupButton.textContent =
                "Create Account";

        }

    }
);


/* =========================================================
   INITIAL CAPTCHA
========================================================= */

generateCaptcha();

</script>

</body>
</html>
