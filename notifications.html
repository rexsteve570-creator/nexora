<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications — NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#07111f;
    --card:#0d1b2d;
    --card2:#102238;
    --border:rgba(255,255,255,.08);
    --text:#f5f7fa;
    --muted:#8e9bad;
    --gold:#d7a83f;
    --gold2:#f0c766;
    --danger:#ef4444;
    --success:#22c55e;
    --nav:#081423;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button{
    font:inherit;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:68px;
    background:rgba(7,17,31,.96);
    border-bottom:1px solid var(--border);
    z-index:1000;
    backdrop-filter:blur(14px);
}

.topbar-inner{
    width:100%;
    max-width:760px;
    height:68px;
    margin:auto;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
}

.menu-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:25px;
}

.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:21px;
    font-weight:800;
    letter-spacing:1.2px;
}

.logo span{
    color:var(--gold);
}

.profile-mini{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg,#d7a83f,#8f671b);
    color:#101010;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

/* =========================
   DRAWER
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1100;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

.drawer{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:285px;
    max-width:86%;
    background:#091625;
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:.28s ease;
    z-index:1200;
    padding:20px 15px;
    overflow-y:auto;
}

.drawer.open{
    transform:translateX(0);
}

.drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 7px 24px;
    border-bottom:1px solid var(--border);
}

.drawer-logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:1px;
}

.drawer-logo span{
    color:var(--gold);
}

.close-btn{
    border:0;
    background:transparent;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.drawer-links{
    padding-top:15px;
}

.drawer-link{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 12px;
    border-radius:11px;
    color:#dce3ec;
    font-size:14px;
    margin-bottom:4px;
}

.drawer-link:hover{
    background:rgba(255,255,255,.05);
}

.drawer-link.active{
    background:rgba(215,168,63,.12);
    color:var(--gold2);
}

.drawer-icon{
    width:22px;
    text-align:center;
    font-size:18px;
}

.logout{
    margin-top:18px;
    color:#ff8b8b;
}

/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:92px 18px 100px;
}

.page-title{
    font-size:25px;
    font-weight:800;
    margin-bottom:7px;
}

.page-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:22px;
}

/* =========================
   ACTION BAR
========================= */

.action-bar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
}

.mark-all{
    border:1px solid rgba(215,168,63,.3);
    background:rgba(215,168,63,.08);
    color:var(--gold2);
    border-radius:9px;
    padding:9px 13px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.mark-all:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================
   NOTIFICATIONS
========================= */

.notifications{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.notification{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:16px;
    display:flex;
    gap:13px;
    transition:.2s;
}

.notification.unread{
    border-color:rgba(215,168,63,.25);
    background:linear-gradient(
        135deg,
        rgba(215,168,63,.08),
        var(--card)
    );
}

.notification.unread::before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    bottom:14px;
    width:3px;
    background:var(--gold);
    border-radius:0 4px 4px 0;
}

.notification-icon{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:12px;
    background:rgba(215,168,63,.1);
    border:1px solid rgba(215,168,63,.16);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold2);
    font-size:18px;
}

.notification-content{
    flex:1;
    min-width:0;
}

.notification-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.notification-title{
    font-size:14px;
    font-weight:750;
    line-height:1.35;
}

.notification.unread .notification-title{
    color:#fff;
}

.notification-time{
    color:#69788a;
    font-size:10px;
    white-space:nowrap;
}

.notification-message{
    color:#9ca9b9;
    font-size:12px;
    line-height:1.55;
    margin-top:6px;
}

.notification-actions{
    margin-top:11px;
}

.read-btn{
    border:0;
    background:transparent;
    padding:0;
    color:var(--gold2);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.read-label{
    color:#627083;
    font-size:11px;
}

/* =========================
   EMPTY
========================= */

.empty{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:45px 20px;
    text-align:center;
}

.empty-icon{
    width:55px;
    height:55px;
    margin:0 auto 14px;
    border-radius:50%;
    background:rgba(215,168,63,.08);
    color:var(--gold2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.empty-title{
    font-size:16px;
    font-weight:750;
    margin-bottom:6px;
}

.empty-text{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:88px;
    transform:translate(-50%,20px);
    background:#142238;
    border:1px solid var(--border);
    color:#fff;
    padding:11px 15px;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    background:rgba(8,20,35,.98);
    border-top:1px solid var(--border);
    z-index:1000;
}

.bottom-inner{
    max-width:760px;
    height:70px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.bottom-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#718096;
    font-size:10px;
    cursor:pointer;
}

.bottom-item span:first-child{
    font-size:19px;
    line-height:1;
}

.bottom-item.active{
    color:var(--gold2);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:430px){

    .page{
        padding-left:14px;
        padding-right:14px;
    }

    .notification{
        padding:14px;
    }

    .notification-time{
        font-size:9px;
    }
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rihvvwktvgytbqzazage.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dT0xRQmaol55DD9yB7ta6Q_Rzrurfad";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const menuBtn =
    document.getElementById("menuBtn");

const closeBtn =
    document.getElementById("closeBtn");

const drawer =
    document.getElementById("drawer");

const overlay =
    document.getElementById("overlay");

const logoutBtn =
    document.getElementById("logoutBtn");

const profileMini =
    document.getElementById("profileMini");

const notificationsContainer =
    document.getElementById("notificationsContainer");

const markAllBtn =
    document.getElementById("markAllBtn");

const toast =
    document.getElementById("toast");


let currentUser = null;
let notifications = [];


/* =========================================================
   DRAWER
========================================================= */

function openDrawer(){

    drawer.classList.add("open");
    overlay.classList.add("show");

}

function closeDrawer(){

    drawer.classList.remove("open");
    overlay.classList.remove("show");

}

menuBtn.addEventListener(
    "click",
    openDrawer
);

closeBtn.addEventListener(
    "click",
    closeDrawer
);

overlay.addEventListener(
    "click",
    closeDrawer
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.classList.add("show");

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(dateString){

    const date =
        new Date(dateString);

    const now =
        new Date();

    const diff =
        Math.floor(
            (now - date) / 1000
        );

    if(diff < 60){

        return "Just now";

    }

    if(diff < 3600){

        const minutes =
            Math.floor(diff / 60);

        return `${minutes}m ago`;

    }

    if(diff < 86400){

        const hours =
            Math.floor(diff / 3600);

        return `${hours}h ago`;

    }

    if(diff < 604800){

        const days =
            Math.floor(diff / 86400);

        return `${days}d ago`;

    }

    return date.toLocaleDateString(
        undefined,
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   ICON
========================================================= */

function notificationIcon(type){

    switch(type){

        case "WELCOME":
            return "✦";

        case "DEPOSIT":
            return "＋";

        case "EARNING":
            return "↗";

        case "WITHDRAWAL":
            return "↙";

        case "KYC":
            return "✓";

        case "REFERRAL":
            return "♧";

        case "SECURITY":
            return "⌁";

        case "SYSTEM":
            return "◆";

        default:
            return "•";

    }

}


/* =========================================================
   LOAD USER
========================================================= */

async function loadUser(){

    const {
        data,
        error
    } = await db.auth.getSession();

    if(error){

        console.error(error);

        location.href =
            "signin.html";

        return false;

    }

    if(!data.session){

        location.href =
            "signin.html";

        return false;

    }

    currentUser =
        data.session.user;

    return true;

}


/* =========================================================
   PROFILE INITIALS
========================================================= */

async function loadProfile(){

    if(!currentUser) return;

    const {
        data,
        error
    } = await db
        .from("profiles")
        .select("full_name")
        .eq("id", currentUser.id)
        .maybeSingle();

    if(error){

        console.error(
            "Profile error:",
            error
        );

    }

    const name =
        data?.full_name ||
        currentUser.user_metadata?.full_name ||
        currentUser.email ||
        "";

    const parts =
        name
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    let initials = "";

    if(parts.length >= 2){

        initials =
            parts[0][0] +
            parts[parts.length - 1][0];

    }else if(parts.length === 1){

        initials =
            parts[0].slice(0,2);

    }else{

        initials =
            "NX";

    }

    profileMini.textContent =
        initials
            .toUpperCase();

}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(){

    notificationsContainer.innerHTML = `
        <div class="loading">
            Loading notifications...
        </div>
    `;

    const {
        data,
        error
    } = await db
        .from("notifications")
        .select(`
            id,
            type,
            title,
            message,
            is_read,
            created_at
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(100);

    if(error){

        console.error(
            "Notifications error:",
            error
        );

        notificationsContainer.innerHTML = `
            <div class="empty">
                <div class="empty-icon">!</div>

                <div class="empty-title">
                    Unable to load notifications
                </div>

                <div class="empty-text">
                    Please try again later.
                </div>
            </div>
        `;

        markAllBtn.disabled = true;

        return;

    }

    notifications =
        data || [];

    renderNotifications();

}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    if(!notifications.length){

        notificationsContainer.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ♢
                </div>

                <div class="empty-title">
                    No notifications
                </div>

                <div class="empty-text">
                    You're all caught up. New account updates will appear here.
                </div>

            </div>
        `;

        markAllBtn.disabled = true;

        return;

    }

    const unreadCount =
        notifications.filter(
            notification =>
                !notification.is_read
        ).length;

    markAllBtn.disabled =
        unreadCount === 0;

    notificationsContainer.innerHTML = `
        <div class="notifications">

            ${notifications.map(
                notification => {

                    const unread =
                        !notification.is_read;

                    return `
                        <article
                            class="notification ${unread ? "unread" : ""}"
                        >

                            <div class="notification-icon">
                                ${notificationIcon(
                                    notification.type
                                )}
                            </div>

                            <div class="notification-content">

                                <div class="notification-top">

                                    <div class="notification-title">
                                        ${escapeHtml(
                                            notification.title
                                        )}
                                    </div>

                                    <div class="notification-time">
                                        ${formatTime(
                                            notification.created_at
                                        )}
                                    </div>

                                </div>

                                <div class="notification-message">
                                    ${escapeHtml(
                                        notification.message
                                    )}
                                </div>

                                <div class="notification-actions">

                                    ${
                                        unread
                                        ?
                                        `
                                        <button
                                            class="read-btn"
                                            onclick="markAsRead(${notification.id})"
                                        >
                                            Mark as read
                                        </button>
                                        `
                                        :
                                        `
                                        <span class="read-label">
                                            Read
                                        </span>
                                        `
                                    }

                                </div>

                            </div>

                        </article>
                    `;

                }
            ).join("")}

        </div>
    `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   MARK ONE AS READ
========================================================= */

async function markAsRead(id){

    const {
        error
    } = await db
        .from("notifications")
        .update({
            is_read:true
        })
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            currentUser.id
        );

    if(error){

        console.error(error);

        showToast(
            "Unable to update notification."
        );

        return;

    }

    const notification =
        notifications.find(
            item =>
                item.id === id
        );

    if(notification){

        notification.is_read = true;

    }

    renderNotifications();

}


/* =========================================================
   MARK ALL AS READ
========================================================= */

markAllBtn.addEventListener(
    "click",
    async function(){

        if(!currentUser) return;

        const unread =
            notifications.filter(
                item =>
                    !item.is_read
            );

        if(!unread.length){

            return;

        }

        markAllBtn.disabled = true;

        const {
            error
        } = await db
            .from("notifications")
            .update({
                is_read:true
            })
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "is_read",
                false
            );

        if(error){

            console.error(error);

            showToast(
                "Unable to mark notifications as read."
            );

            renderNotifications();

            return;

        }

        notifications =
            notifications.map(
                item => ({
                    ...item,
                    is_read:true
                })
            );

        renderNotifications();

        showToast(
            "All notifications marked as read."
        );

    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async function(event){

        event.preventDefault();

        const {
            error
        } = await db.auth.signOut();

        if(error){

            console.error(error);

            showToast(
                "Unable to log out."
            );

            return;

        }

        location.href =
            "signin.html";

    }
);


/* =========================================================
   PROFILE BUTTON
========================================================= */

profileMini.addEventListener(
    "click",
    function(){

        location.href =
            "profile.html";

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
